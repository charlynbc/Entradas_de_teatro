version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: teatro-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-teatro}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - teatro_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teatro_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teatro-backend
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-teatro}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - teatro_network
    restart: unless-stopped

volumes:
  teatro_db:
    driver: local

networks:
  teatro_network:
    driver: bridge
