<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel Administrativo - Baco Teatro">
    <title>Panel Administrativo - Baco Teatro</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="admin-page">
    <div class="admin-container">
        <nav class="admin-sidebar">
            <div class="sidebar-header">
                <h2>🎭 Baco</h2>
            </div>
            
            <ul class="sidebar-menu">
                <li><a href="#dashboard" class="active">📊 Dashboard</a></li>
                <li><a href="#usuarios">👥 Usuarios</a></li>
                <li><a href="#obras">🎬 Obras</a></li>
                <li><a href="#funciones">🎪 Funciones</a></li>
                <li><a href="#tickets">🎟️ Entradas</a></li>
                <li><a href="#reportes">📈 Reportes</a></li>
                <li><a href="#configuracion">⚙️ Configuración</a></li>
                <li><a href="#logout">🚪 Cerrar Sesión</a></li>
            </ul>
        </nav>
        
        <main class="admin-content">
            <header class="admin-header">
                <h1>Panel Administrativo</h1>
                <div class="admin-user">
                    <span id="userName">Usuario</span>
                    <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
                </div>
            </header>
            
            <div id="content" class="admin-main">
                <section id="dashboard-section" class="dashboard">
                    <h2>Dashboard</h2>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Usuarios</h3>
                            <p class="stat-number" id="statUsuarios">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Obras</h3>
                            <p class="stat-number" id="statObras">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Funciones</h3>
                            <p class="stat-number" id="statFunciones">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Entradas Vendidas</h3>
                            <p class="stat-number" id="statTickets">0</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <script src="/js/admin.js" type="module"></script>
</body>
</html>
