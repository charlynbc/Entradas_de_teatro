<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12090D">
    <title>Funciones de Hoy | BACÓ Teatro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/baco-landing.css">
    <link rel="stylesheet" href="/css/nav-auth.css">
    <link rel="stylesheet" href="/css/baco-footer.css">
    <link rel="stylesheet" href="/css/funciones-publicas.css">
</head>
<body>
    <!-- 🔥 HERO Urgente e impactante -->
    <section class="funciones-hero">
        <div class="funciones-hero__inner">
            <div class="funciones-hero__icon">🔥</div>
            <h1 class="funciones-hero__title">Funciones de Hoy</h1>
            <p class="funciones-hero__subtitle">
                Teatro en vivo, hoy <span id="fecha-hoy"></span>. ¡No te lo pierdas!
            </p>
            <div class="funciones-hero__badge">
                <i class="fas fa-bolt"></i>
                <span id="totalHoy">Cargando...</span>
            </div>
            <div class="hero-actions">
                <a href="/proximas-funciones.html" class="hero-button">
                    <span class="button-icon"><i class="fas fa-calendar-alt"></i></span>
                    <span class="button-text"><h3>Próximas Funciones</h3></span>
                </a>
                <a href="/" class="hero-button">
                    <span class="button-icon"><i class="fas fa-home"></i></span>
                    <span class="button-text"><h3>Inicio</h3></span>
                </a>
            </div>
        </div>
    </section>

    <!-- 🎬 GRID - Cards urgentes con hora destacada -->
    <section class="hoy-container">
        <div id="hoyGrid" class="hoy-grid">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Cargando funciones de hoy...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="/shared/layout-loader.js"></script>
    <script src="/js/nav-auth.js"></script>
    <script src="/js/funciones-hoy.js"></script>
</body>
</html>
