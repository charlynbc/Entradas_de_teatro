<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - BACÓ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/baco-common.css">
    <link rel="stylesheet" href="/css/usuarios.css">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a href="/pages/admin/admin-dashboard.html" class="btn-back">
                <i class="fas fa-arrow-left"></i>
                Volver al panel
            </a>
        </div>

        <section class="hero">
            <h1 class="hero__title">Usuarios de BACÓ</h1>
            <p class="hero__subtitle">Orquesta a tu elenco con filtros rápidos, acciones directas y una visual teatral.</p>
            <div class="hero__actions">
                <div class="btn-toggle-group">
                    <button class="btn-toggle active" data-view="grid" onclick="toggleView('grid')">
                        <span>⊞</span> Tarjetas
                    </button>
                    <button class="btn-toggle" data-view="list" onclick="toggleView('list')">
                        <span>☰</span> Lista
                    </button>
                </div>
                <button class="btn-secondary btn-export" onclick="exportToCSV()">
                    <span>⬇</span> Exportar CSV
                </button>
                <button class="btn-ghost" id="refreshUsers" type="button"><i class="fas fa-rotate"></i> Recargar lista</button>
                <a class="btn-primary" href="crear-director.html" id="btnCrearDirector" style="display: none;"><i class="fas fa-user-tie"></i> Alta Director</a>
                <a class="btn-secondary" href="crear-actor.html"><i class="fas fa-theater-masks"></i> Alta Actor/Actriz</a>
            </div>
        </section>

        <div class="layout">
            <aside>
                <div class="panel">
                    <h3 class="panel__title"><i class="fas fa-filter"></i> Filtros rápidos</h3>
                    <div class="filter-grid">
                        <div class="field">
                            <label class="label">Buscar</label>
                            <input class="input" type="text" id="searchInput" placeholder="Nombre o cédula...">
                        </div>
                        <div class="field">
                            <label class="label">Rol</label>
                            <select class="select" id="filterRole">
                                <option value="">Todos</option>
                                <option value="SUPER">Super Usuario</option>
                                <option value="ADMIN">Director</option>
                                <option value="ACTOR">Actor/Actriz</option>
                            </select>
                        </div>
                        <div class="field">
                            <label class="label">Orden</label>
                            <select class="select" id="sortBy">
                                <option value="nombre">Nombre</option>
                                <option value="role">Rol</option>
                                <option value="fecha">Fecha de registro</option>
                            </select>
                        </div>
                    </div>
                </div>
            </aside>

            <section class="stack">
                <div class="panel">
                    <div class="stats-row">
                        <div class="stat-pill">
                            <div class="stat-pill__label">Total Usuarios</div>
                            <div class="stat-pill__value" id="totalUsers">0</div>
                        </div>
                        <div class="stat-pill">
                            <div class="stat-pill__label">Directores</div>
                            <div class="stat-pill__value" id="totalDirectores">0</div>
                        </div>
                        <div class="stat-pill">
                            <div class="stat-pill__label">Actores</div>
                            <div class="stat-pill__value" id="totalActores">0</div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="panel__title"><i class="fas fa-users"></i> Lista de usuarios</h3>
                    <div id="usersContainer">
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            <div>Cargando usuarios...</div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="/js/baco-common.js?v=20251228"></script>
    <script>
        // Verificar autenticación
        if (!Baco.Auth.requireAuth()) return;
        
        const user = JSON.parse(localStorage.getItem('user') || '{}');
            // Validación robusta: no depender de localStorage corrupto/viejo
            (async () => {
                const user = await Baco.Auth.ensureUser();
                if (!user || !user.role) {
                    Baco.UI.showError('Sesión inválida. Por favor inicia sesión.');
                    setTimeout(() => window.location.href = '/pages/auth/login.html', 1200);
                    return;
                }
                if (user.role !== 'SUPER' && user.role !== 'ADMIN') {
                    Baco.UI.showError('Acceso denegado. Solo Super Usuarios o Directores.');
                    setTimeout(() => window.location.href = '/pages/auth/login.html', 1200);
                }
            })();

        let allUsers = [];
        let currentView = localStorage.getItem('usuarios-vista') || 'grid';
        
        // 👑 Mostrar botón Crear Director solo para SUPER
        if (user.role === 'SUPER') {
            document.getElementById('btnCrearDirector').style.display = 'inline-flex';
        }

        // Toggle de vista
        function toggleView(view) {
            currentView = view;
            localStorage.setItem('usuarios-vista', view);
            
            const container = document.getElementById('usersContainer');
            const grid = container.querySelector('.users-grid');
            const toggles = document.querySelectorAll('.btn-toggle');
            
            toggles.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            
            if (grid) {
                if (view === 'list') {
                    grid.classList.add('list-view');
                } else {
                    grid.classList.remove('list-view');
                }
            }
        }

        // Exportar a CSV
        function exportToCSV() {
            if (allUsers.length === 0) {
                Baco.UI.showError('No hay usuarios para exportar');
                return;
            }
            
            const headers = ['Cédula', 'Nombre', 'Rol', 'Email', 'Teléfono', 'Fecha Nacimiento', 'Estado', 'Fecha Alta'];
            const rows = allUsers.map(u => [
                u.cedula || '',
                u.nombre || u.name || '',
                u.role || '',
                u.email || '',
                u.phone || '',
                u.fecha_nacimiento || '',
                u.suspendido ? 'SUSPENDIDO' : 'ACTIVO',
                u.created_at ? new Date(u.created_at).toLocaleDateString() : ''
            ]);
            
            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `usuarios-baco-${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(url);
            
            Baco.UI.showSuccess(`${allUsers.length} usuarios exportados`);
        }

        // Cargar usuarios
        async function loadUsers() {
            Baco.UI.showLoading('Cargando usuarios...');
            
            try {
                allUsers = await Baco.API.get('/users');
                updateStats();
                renderUsers(allUsers);
                // Restaurar vista
                setTimeout(() => toggleView(currentView), 100);
            } catch (error) {
                showError('Error al cargar usuarios');
            } finally {
                Baco.UI.hideLoading();
            }
        }

        function updateStats() {
            document.getElementById('totalUsers').textContent = allUsers.length;
            document.getElementById('totalDirectores').textContent = 
                allUsers.filter(u => u.role === 'ADMIN').length;
            document.getElementById('totalActores').textContent = 
                allUsers.filter(u => u.role === 'ACTOR').length;
        }

        function renderUsers(users) {
            const container = document.getElementById('usersContainer');

            if (users.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 80px 20px;">
                        <div style="font-size: 4rem; opacity: 0.3; margin-bottom: 20px;">🎭</div>
                        <h3 style="color: var(--texto-suave); margin-bottom: 12px; font-weight: 600;">No se encontraron usuarios</h3>
                        <p style="color: var(--texto-suave); opacity: 0.7; margin-bottom: 24px;">Intenta ajustar los filtros de búsqueda o crea nuevos usuarios</p>
                        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                            <button class="btn-secondary" onclick="document.getElementById('searchInput').value=''; document.getElementById('roleFilter').value=''; applyFilters();">
                                Limpiar filtros
                            </button>
                            <a href="crear-actor.html" class="btn-primary">
                                Crear primer actor
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            const usersGrid = document.createElement('div');
            usersGrid.className = 'users-grid';
            if (currentView === 'list') {
                usersGrid.classList.add('list-view');
            }

            users.forEach(usuario => {
                const card = document.createElement('div');
                card.className = 'user-card';
                
                const roleClass = usuario.role === 'SUPER' ? 'super' : 
                                 usuario.role === 'ADMIN' ? 'admin' : 'actor';
                
                const roleText = usuario.role === 'SUPER' ? 'Super Usuario' : 
                                usuario.role === 'ADMIN' ? 'Director' : 'Actor/Actriz';

                // Calcular estado "nuevo"
                const isNew = usuario.created_at && (Date.now() - new Date(usuario.created_at).getTime() < 7 * 24 * 60 * 60 * 1000);
                
                // Calcular actividad reciente
                const lastActivity = usuario.updated_at ? new Date(usuario.updated_at) : null;
                const daysSinceActivity = lastActivity ? Math.floor((Date.now() - lastActivity.getTime()) / (24 * 60 * 60 * 1000)) : 999;
                const activityStatus = daysSinceActivity < 7 ? 'active' : daysSinceActivity < 30 ? 'recent' : 'inactive';
                
                // Contar funciones activas (si existen)
                const funcionesActivas = (usuario.funciones || []).filter(f => new Date(f.fecha_hora) > Date.now()).length;

                // Usar componente de imagen circular
                const photoUrl = usuario.photo_url || Baco.Image.getPlaceholder(usuario.nombre || usuario.name, 70);

                card.innerHTML = `
                    <div class="quick-actions">
                        <button class="quick-btn" onclick="viewUser('${usuario.cedula}')" title="Ver perfil">
                            👁
                        </button>
                        <button class="quick-btn" onclick="editUser('${usuario.cedula}')" title="Editar">
                            ✎
                        </button>
                    </div>
                    
                    <div class="user-header">
                        <img src="${photoUrl}" 
                             alt="${usuario.nombre || usuario.name}" 
                             class="user-photo photo-circular"
                             onerror="this.src='${Baco.Image.getPlaceholder(usuario.nombre || usuario.name, 70)}'">
                        <div class="user-info">
                            <div class="user-name">${usuario.nombre || usuario.name}</div>
                            <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                                <span class="status-dot ${activityStatus}"></span>
                                <span class="badge ${roleClass}">${roleText}</span>
                                ${isNew ? '<span class="badge nuevo">✨ Nuevo</span>' : ''}
                                ${funcionesActivas > 0 ? `<span class="funciones-badge">🎭 ${funcionesActivas}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="user-details">
                        <div class="detail-row">
                            <i class="fas fa-id-card"></i>
                            <span>CI: ${Baco.Format.cedula(usuario.cedula)}</span>
                        </div>
                        <div class="detail-row">
                            <i class="fas fa-phone"></i>
                            <span>${usuario.phone || 'Sin teléfono'}</span>
                        </div>
                        <div class="detail-row">
                            <i class="fas fa-calendar"></i>
                            <span>${usuario.fecha_nacimiento ? Baco.Format.date(usuario.fecha_nacimiento) : 'Sin fecha'}</span>
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="btn-action btn-view" onclick="viewUser('${usuario.cedula}')">
                            <i class="fas fa-eye"></i>
                            Ver Perfil
                        </button>
                        ${usuario.role !== 'SUPER' ? `
                            <button class="btn-action btn-suspend" onclick="suspendUser('${usuario.cedula}')">
                                <i class="fas fa-ban"></i>
                                Suspender
                            </button>
                        ` : ''}
                    </div>
                `;

                usersGrid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(usersGrid);
        }

        function editUser(cedula) {
            window.location.href = `ver-usuario.html?cedula=${cedula}#editar`;
        }

        function showError(message) {
            const container = document.getElementById('usersContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        function viewUser(cedula) {
            window.location.href = `ver-usuario.html?cedula=${cedula}`;
        }

        async function suspendUser(cedula) {
            Baco.UI.confirm(
                `¿Estás seguro de suspender al usuario con CI: ${Baco.Format.cedula(cedula)}?`,
                async () => {
                    try {
                        await Baco.API.delete(`/users/${cedula}`);
                        Baco.UI.showSuccess('Usuario suspendido correctamente');
                        loadUsers(); // Recargar lista
                    } catch (error) {
                        // Error ya manejado por Baco.API
                    }
                }
            );
        }

        // Filtros
        document.getElementById('searchInput').addEventListener('input', filterUsers);
        document.getElementById('roleFilter').addEventListener('change', filterUsers);
        document.getElementById('sortBy').addEventListener('change', filterUsers);
        document.getElementById('refreshUsers').addEventListener('click', loadUsers);

        function filterUsers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const role = document.getElementById('roleFilter').value;
            const sort = document.getElementById('sortBy').value;

            let filtered = allUsers.filter(u => {
                const matchSearch = (u.nombre || u.name || '').toLowerCase().includes(search) || 
                                   (u.cedula || '').includes(search);
                const matchRole = !role || u.role === role;
                return matchSearch && matchRole;
            });

            // Ordenar
            if (sort === 'nombre') {
                filtered.sort((a, b) => (a.nombre || a.name || '').localeCompare(b.nombre || b.name || ''));
            } else if (sort === 'role') {
                filtered.sort((a, b) => (a.role || '').localeCompare(b.role || ''));
            } else if (sort === 'fecha') {
                filtered.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            }

            renderUsers(filtered);
        }

        function applyFilters() {
            filterUsers();
        }

        // Cargar al inicio
        loadUsers();
    </script>
</body>
</html>
