<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - BACÓ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/baco-common.css">
    <link rel="stylesheet" href="/css/usuarios.css">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a href="/pages/usuarios/listar-usuarios.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver a usuarios</a>
        </div>

        <section class="hero">
            <h1 class="hero__title">Perfil de Usuario</h1>
            <p class="hero__subtitle" id="heroSubtitle">Un vistazo elegante a cada rol de BACÓ.</p>
            <div class="hero__actions" id="heroActions" style="display: none;">
                <button class="btn-ghost" onclick="volverAlModoNormal()">
                    <i class="fas fa-arrow-left"></i> Salir del modo impersonar
                </button>
            </div>
        </section>

        <div id="userContainer" class="profile-shell">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <div>Cargando perfil...</div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Editar usuario</h3>
            <p>Ajusta los datos de contacto y notas del usuario.</p>
            <form id="editForm" class="form-grid">
                <div class="field">
                    <label class="label" for="editNombre">Nombre</label>
                    <input class="input" type="text" id="editNombre" name="nombre" placeholder="Nombre" required>
                </div>
                <div class="field">
                    <label class="label" for="editApellido">Apellido</label>
                    <input class="input" type="text" id="editApellido" name="apellido" placeholder="Apellido">
                </div>
                <div class="field">
                    <label class="label" for="editEmail">Email</label>
                    <input class="input" type="email" id="editEmail" name="email" placeholder="correo@baco.uy">
                </div>
                <div class="field">
                    <label class="label" for="editPhone">Teléfono</label>
                    <input class="input" type="text" id="editPhone" name="phone" placeholder="09xxxxxxx" inputmode="tel">
                </div>
                <div class="field">
                    <label class="label" for="editFecha">Fecha de nacimiento</label>
                    <input class="input" type="date" id="editFecha" name="fecha_nacimiento">
                </div>
                <div class="field" style="grid-column: 1/-1;">
                    <label class="label" for="editNotas">Notas</label>
                    <textarea class="input" id="editNotas" name="notas" rows="3" placeholder="Notas internas o descripción"></textarea>
                </div>
            </form>
            <div class="modal-actions">
                <button type="button" class="btn-small" id="cancelEdit">Cancelar</button>
                <button type="submit" form="editForm" class="btn-primary">Guardar cambios</button>
            </div>
        </div>
    </div>

    <script src="/js/baco-common.js?v=20251228"></script>
    <script>
        // Verificar autenticación
        if (!Baco.Auth.requireAuth()) return;

        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        const isSuperUser = currentUser.role === 'SUPER';
        const isAdmin = currentUser.role === 'ADMIN';
        
        if (!isSuperUser && !isAdmin) {
            Baco.UI.showError('Acceso denegado');
            setTimeout(() => window.location.href = '/pages/auth/login.html', 1800);
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const cedula = urlParams.get('cedula');

        if (!cedula) {
            Baco.UI.showError('Cédula no especificada');
            setTimeout(() => window.location.href = '/pages/usuarios/listar-usuarios.html', 1500);
            return;
        }

        let currentProfile = null;
        
        // 👑 MODO IMPERSONAR: Solo para Super Usuario
        if (isSuperUser) {
            document.getElementById('heroSubtitle').innerHTML = '👑 <strong>Modo Super Usuario</strong>: Viendo como si estuvieras logueado en esta cuenta';
            document.getElementById('heroActions').style.display = 'flex';
        }
        
        function volverAlModoNormal() {
            window.location.href = '/pages/usuarios/listar-usuarios.html';
        }

        async function loadUser() {
            try {
                const user = await Baco.API.get(`/users/${cedula}`);
                currentProfile = user;
                renderUser(user);
            } catch (error) {
                console.error('Error:', error);
                showError('Error al cargar el usuario');
            }
        }

        function renderUser(user) {
            const container = document.getElementById('userContainer');

            const roleRaw = user.role || user.rol || '';
            const roleClass = roleRaw === 'SUPER' ? 'super' :
                             roleRaw === 'ADMIN' ? 'admin' : 'actor';

            const roleText = roleRaw === 'SUPER' ? 'Super Usuario' :
                            roleRaw === 'ADMIN' ? 'Director' : 'Actor/Actriz';

            const nombre = user.nombre || user.name || 'Sin nombre';
            const apellido = user.apellido || '';
            const photoUrl = user.foto_url || user.photo_url || Baco.Image.getPlaceholder(nombre, 180);

            const lastFuncionDate = (user.funciones || []).reduce((acc, funcion) => {
                if (!funcion.fecha) return acc;
                const current = new Date(funcion.fecha);
                return (!acc || current > acc) ? current : acc;
            }, null);
            const lastFuncionStr = lastFuncionDate ? Baco.Format.date(lastFuncionDate.toISOString()) : 'Sin funciones previas';

            const statsHTML = `
                <div class="stats-row">
                    <div class="stat-pill">
                        <div class="stat-pill__label">Grupos</div>
                        <div class="stat-pill__value">${user.grupos_count || user.grupos?.length || 0}</div>
                    </div>
                    <div class="stat-pill">
                        <div class="stat-pill__label">Funciones</div>
                        <div class="stat-pill__value">${user.funciones_count || user.funciones?.length || 0}</div>
                    </div>
                    <div class="stat-pill">
                        <div class="stat-pill__label">Entradas vendidas</div>
                        <div class="stat-pill__value">${user.entradas_vendidas || 0}</div>
                    </div>
                    <div class="stat-pill">
                        <div class="stat-pill__label">Días activo</div>
                        <div class="stat-pill__value">${user.dias_activo || 0}</div>
                    </div>
                </div>
            `;

            const activityHTML = `
                <div class="subsection">
                    <h3 class="subsection__title"><i class="fas fa-bolt"></i> Actividad reciente</h3>
                    <div class="activity-grid">
                        <div class="activity-card">
                            <div class="activity-label"><i class="fas fa-pen"></i> Última actualización</div>
                            <div class="activity-value">${user.updated_at ? Baco.Format.date(user.updated_at) : '—'}</div>
                        </div>
                        <div class="activity-card">
                            <div class="activity-label"><i class="fas fa-user-plus"></i> Alta en BACÓ</div>
                            <div class="activity-value">${user.created_at ? Baco.Format.date(user.created_at) : '—'}</div>
                        </div>
                        <div class="activity-card">
                            <div class="activity-label"><i class="fas fa-masks-theater"></i> Última función</div>
                            <div class="activity-value">${lastFuncionStr}</div>
                        </div>
                    </div>
                </div>
            `;

            const gruposHTML = user.grupos && user.grupos.length > 0 ? `
                <div class="subsection">
                    <h3 class="subsection__title"><i class="fas fa-users"></i> Grupos (${user.grupos.length})</h3>
                    <div class="list-modern">
                        ${user.grupos.map(grupo => `
                            <div class="list-modern__item">
                                <div class="list-modern__title">${grupo.nombre}</div>
                                <div class="list-modern__meta">
                                    <span><i class="fas fa-theater-masks"></i> ${grupo.obra}</span>
                                    <span><i class="fas fa-users"></i> ${grupo.miembros_count || 0} miembros</span>
                                    <span><i class="fas fa-calendar"></i> ${grupo.funciones_count || 0} funciones</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            const funcionesHTML = user.funciones && user.funciones.length > 0 ? `
                <div class="subsection">
                    <h3 class="subsection__title"><i class="fas fa-calendar-alt"></i> Próximas funciones</h3>
                    <div class="list-modern">
                        ${user.funciones.map(funcion => `
                            <div class="list-modern__item">
                                <div class="list-modern__title">${funcion.obra || 'Sin título'}</div>
                                <div class="list-modern__meta">
                                    <span><i class="fas fa-calendar"></i> ${Baco.Format.date(funcion.fecha)}</span>
                                    <span><i class="fas fa-clock"></i> ${funcion.hora || 'Sin hora'}</span>
                                    <span><i class="fas fa-map-marker-alt"></i> ${funcion.lugar || 'Sin lugar'}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            const inlineActions = roleRaw !== 'SUPER' ? `
                <div class="inline-actions">
                    <button class="btn-small" onclick="openEditModal()"><i class="fas fa-edit"></i> Editar</button>
                    <button class="btn-small danger" onclick="suspendUser('${user.cedula}')"><i class="fas fa-ban"></i> Suspender</button>
                </div>
            ` : '';

            container.innerHTML = `
                <div class="profile-top">
                    <img src="${photoUrl}" alt="${nombre}" class="profile-photo" onerror="this.src='${Baco.Image.getPlaceholder(nombre, 180)}'">
                    <div class="profile-head__body">
                        <div class="profile-head__row">
                            <h2 class="profile-name">${nombre} ${apellido}</h2>
                            <span class="badge ${roleClass}">${roleText}</span>
                        </div>
                        <div class="profile-meta">
                            <span class="chip"><i class="fas fa-id-card"></i>${Baco.Format.cedula(user.cedula)}</span>
                            <span class="chip"><i class="fas fa-envelope"></i>${user.email || 'Sin email'}</span>
                            <span class="chip"><i class="fas fa-phone"></i>${user.phone || 'Sin teléfono'}</span>
                            <span class="chip"><i class="fas fa-birthday-cake"></i>${user.fecha_nacimiento ? Baco.Format.date(user.fecha_nacimiento) : 'Sin fecha'}</span>
                        </div>
                        ${inlineActions}
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-tile"><p class="label">Rol</p><p class="value">${roleText}</p></div>
                    <div class="info-tile"><p class="label">Estado</p><p class="value">${user.active === false ? 'Inactivo' : 'Activo'}</p></div>
                    <div class="info-tile"><p class="label">Actualizado</p><p class="value">${user.updated_at ? Baco.Format.date(user.updated_at) : '—'}</p></div>
                    <div class="info-tile"><p class="label">Registrado</p><p class="value">${user.created_at ? Baco.Format.date(user.created_at) : '—'}</p></div>
                </div>

                ${activityHTML}
                ${statsHTML}
                ${gruposHTML || '<div class="subsection"><p class="label">Sin grupos asignados</p></div>'}
                ${funcionesHTML || '<div class="subsection"><p class="label">Sin funciones programadas</p></div>'}
            `;
        }

        function showError(message) {
            document.getElementById('userContainer').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>${message}</p>
                </div>
            `;
        }

        function openEditModal() {
            if (!currentProfile) return;
            document.getElementById('editNombre').value = currentProfile.nombre || currentProfile.name || '';
            document.getElementById('editApellido').value = currentProfile.apellido || '';
            document.getElementById('editEmail').value = currentProfile.email || '';
            document.getElementById('editPhone').value = currentProfile.phone || '';
            document.getElementById('editFecha').value = currentProfile.fecha_nacimiento ? currentProfile.fecha_nacimiento.split('T')[0] : '';
            document.getElementById('editNotas').value = currentProfile.notas || '';
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        async function handleEditSubmit(event) {
            event.preventDefault();
            const payload = {
                nombre: document.getElementById('editNombre').value.trim(),
                apellido: document.getElementById('editApellido').value.trim(),
                email: document.getElementById('editEmail').value.trim(),
                phone: document.getElementById('editPhone').value.trim(),
                fecha_nacimiento: document.getElementById('editFecha').value,
                notas: document.getElementById('editNotas').value.trim()
            };

            if (payload.email && !Baco.Validate.email(payload.email)) {
                Baco.UI.showError('Email inválido');
                return;
            }

            if (payload.phone && !Baco.Validate.phone(payload.phone)) {
                Baco.UI.showError('El teléfono debe tener 8 o 9 dígitos');
                return;
            }

            const sanitized = {};
            Object.entries(payload).forEach(([key, value]) => {
                if (value !== '') {
                    sanitized[key] = value;
                }
            });

            try {
                await Baco.API.put(`/users/${cedula}`, sanitized);
                Baco.UI.showSuccess('Perfil actualizado');
                closeEditModal();
                loadUser();
            } catch (error) {
                // Error manejado por Baco.API
            }
        }

        async function suspendUser(cedula) {
            const confirmed = await Baco.UI.confirm(
                `¿Estás seguro de suspender al usuario con CI: ${Baco.Format.cedula(cedula)}?`,
                '⚠️ Suspender Usuario',
                'Sí, suspender'
            );

            if (confirmed) {
                try {
                    await Baco.API.delete(`/users/${cedula}`);
                    Baco.UI.showSuccess('Usuario suspendido correctamente');
                    setTimeout(() => window.location.href = '/pages/usuarios/listar-usuarios.html', 1500);
                } catch (error) {
                    // Error ya manejado por Baco.API
                }
            }
        }

        document.getElementById('cancelEdit').addEventListener('click', closeEditModal);
        document.getElementById('editModal').addEventListener('click', (event) => {
            if (event.target.id === 'editModal') closeEditModal();
        });
        document.getElementById('editForm').addEventListener('submit', handleEditSubmit);

        loadUser();
    </script>
</body>
</html>
