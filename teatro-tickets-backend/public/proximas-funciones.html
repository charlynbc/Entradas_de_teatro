<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12090D">
    <title>Próximas Funciones - Baco Teatro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/baco-landing.css">
    <link rel="stylesheet" href="/css/nav-auth.css">
    <link rel="stylesheet" href="/css/baco-footer.css">
    <link rel="stylesheet" href="/css/funciones-publicas.css">
    <link rel="stylesheet" href="/css/reserva-modales.css">
</head>
<body>
    <!-- 🎭 HERO Elegante y anticipatorio -->
    <section class="funciones-hero">
        <div class="funciones-hero__inner">
            <div class="funciones-hero__icon">🎭</div>
            <h1 class="funciones-hero__title">Próximas Funciones</h1>
            <p class="funciones-hero__subtitle">
                Descubrí el teatro que viene. Elegí tu fecha, reservá con tiempo y viví BACÓ.
            </p>
            <div class="funciones-hero__badge">
                <i class="fas fa-calendar-alt"></i>
                <span id="totalProximas">Cargando cartelera...</span>
            </div>
            <div class="hero-actions">
                <a href="/funciones.html" class="hero-button">
                    <span class="button-icon"><i class="fas fa-calendar-day"></i></span>
                    <span class="button-text"><h3>Ver Todas las Funciones</h3></span>
                </a>
                <a href="/" class="hero-button">
                    <span class="button-icon"><i class="fas fa-home"></i></span>
                    <span class="button-text"><h3>Inicio</h3></span>
                </a>
            </div>
        </div>
    </section>

    <!-- 📅 CARTELERA - Cards elegantes con anticipación -->
    <section class="proximas-container">
        <div id="proximasTimeline">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Preparando la cartelera...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="/shared/layout-loader.js?v=20260111"></script>
    <script src="/js/nav-auth.js?v=20260111"></script>
    <script src="/js/reserva-flujo.js?v=20260111"></script>
    <script src="/js/proximas-funciones.js?v=20260111"></script>
</body>
</html>
