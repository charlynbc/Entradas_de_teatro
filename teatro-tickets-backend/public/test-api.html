<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test API Funciones</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        pre { background: #000; padding: 15px; border: 1px solid #0f0; overflow-x: auto; }
        .error { color: #f00; }
        .success { color: #0f0; }
        button { padding: 10px 20px; margin: 10px 0; background: #0f0; color: #000; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Test API Funciones</h1>
    
    <button onclick="testAPI()">Test API</button>
    <button onclick="testFuncionesHoy()">Test Filtro Hoy</button>
    
    <h2>Response:</h2>
    <pre id="output">Esperando test...</pre>
    
    <h2>Debug Logs:</h2>
    <pre id="logs"></pre>
    
    <script>
        const output = document.getElementById('output');
        const logs = document.getElementById('logs');
        
        function log(msg) {
            console.log(msg);
            logs.textContent += msg + '\n';
        }
        
        async function testAPI() {
            output.textContent = 'Loading...';
            logs.textContent = '';
            
            try {
                log('📡 Fetch: /api/public/funciones');
                const response = await fetch('/api/public/funciones');
                log('✅ Status: ' + response.status);
                
                const data = await response.json();
                log('📦 Data type: ' + (Array.isArray(data) ? 'Array' : typeof data));
                log('📊 Length: ' + data.length);
                
                output.textContent = JSON.stringify(data, null, 2);
                output.className = 'success';
                
                // Test individual items
                if (data.length > 0) {
                    const first = data[0];
                    log('\n🔍 Primer item:');
                    log('  - id: ' + first.id);
                    log('  - fecha: ' + first.fecha);
                    log('  - hora: ' + first.hora);
                    log('  - obra_nombre: ' + first.obra_nombre);
                    log('  - grupo_nombre: ' + first.grupo_nombre);
                    log('  - sala: ' + first.sala);
                    log('  - precio: ' + first.precio);
                    log('  - es_profesional: ' + first.es_profesional);
                    log('  - entradas_disponibles: ' + first.entradas_disponibles);
                }
                
            } catch (error) {
                log('❌ Error: ' + error.message);
                output.textContent = 'Error: ' + error.message;
                output.className = 'error';
            }
        }
        
        async function testFuncionesHoy() {
            output.textContent = 'Loading...';
            logs.textContent = '';
            
            try {
                const response = await fetch('/api/public/funciones');
                const data = await response.json();
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                
                log('📅 Hoy: ' + today.toISOString());
                log('📅 Mañana: ' + tomorrow.toISOString());
                log('📊 Total funciones: ' + data.length);
                
                const funcionesHoy = data.filter(f => {
                    const fecha = new Date(f.fecha);
                    const esHoy = fecha >= today && fecha < tomorrow;
                    log(`  Función ${f.id}: ${f.fecha} (${fecha.toISOString()}) -> ${esHoy ? 'HOY ✓' : 'OTRO DÍA ✗'}`);
                    return esHoy;
                });
                
                log('\n✅ Funciones de HOY: ' + funcionesHoy.length);
                output.textContent = JSON.stringify(funcionesHoy, null, 2);
                output.className = 'success';
                
            } catch (error) {
                log('❌ Error: ' + error.message);
                output.textContent = 'Error: ' + error.message;
                output.className = 'error';
            }
        }
        
        // Auto-run on load
        window.addEventListener('load', () => {
            log('🚀 Página cargada. Listo para tests.');
        });
    </script>
</body>
</html>
