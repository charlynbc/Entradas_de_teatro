<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Funciones</title>
</head>
<body>
    <h1>Test Carga de Funciones</h1>
    <div id="result">Cargando...</div>
    <div id="error" style="color: red;"></div>
    
    <script>
        console.log('Script iniciado');
        
        async function testLoad() {
            try {
                console.log('Haciendo fetch...');
                const response = await fetch('/api/public/funciones');
                console.log('Response:', response);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Data:', data);
                
                document.getElementById('result').innerHTML = `
                    <h2>Funciones cargadas: ${data.length}</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('error').textContent = 'Error: ' + error.message;
            }
        }
        
        document.addEventListener('DOMContentLoaded', testLoad);
    </script>
</body>
</html>
